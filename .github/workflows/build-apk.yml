name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: ./web
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./web
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./web/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./web/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename and Prepare APK Artifact
        run: |
          mkdir -p release-apk
          cp web/android/app/build/outputs/apk/debug/app-debug.apk release-apk/PotholeDetect.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PotholeDetect-Android-APK
          path: release-apk/PotholeDetect.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-apk-latest
          name: "📱 PotholeDetect Android Mobile APK"
          body: |
            ## 🛣️ PotholeDetect Native Android APK Release
            Download and install the native Android APK directly on your phone!

            ### 📦 Download Link:
            - **[Download PotholeDetect.apk](https://github.com/${{ github.repository }}/releases/download/mobile-apk-latest/PotholeDetect.apk)**

            ### 📲 Installation Instructions:
            1. Tap the download link on your Android device.
            2. Open the downloaded `PotholeDetect.apk` file.
            3. Tap **"Install"** (Allow "Install from Unknown Sources / Chrome" if prompted).
            4. Grant Camera and Location permissions when opening the app.
          files: release-apk/PotholeDetect.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
